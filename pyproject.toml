[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoscientist-etft"
version = "0.1.0"
description = "Evolutionary Trajectory Fine-Tuning — Reverse-Engineering Algorithmic Progression"
authors = [{ name = "Lukas Benda", email = "lukas.benda@boldpivot.cz" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["LLM", "fine-tuning", "evolutionary", "research", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "requests>=2.31",
    "httpx>=0.26",
    "arxiv>=2.1",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "click>=8.1",
    "rich>=13.7",
    "tqdm>=4.66",
    "tenacity>=8.3",
]

[project.optional-dependencies]
finetune = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.29",
    "datasets>=2.18",
]
rag = ["chromadb>=0.5"]
cluster = ["kubernetes>=28.1"]
viz = ["matplotlib>=3.8", "plotly>=5.20"]
dev = ["pytest>=8.1", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
etft-train = "train:main"
etft-corpus = "corpus.regression_pipeline.run:main"
etft-arl = "agents.run_arl:main"
etft-generate = "synthesis.sota_plus_one.generate:main"
etft-bootstrap-filter = "corpus.performance_estimator.bootstrap:main"
etft-pipeline = "pipeline:main"
etft-report = "reporting:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "data*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "corpus", "agents", "analysis", "synthesis", "feedback"]
addopts = "--tb=short"
