# =============================================================================
# AutoScientist-ETFT — Centralized Runtime Configuration
# Values here are defaults; override via environment variables or --config CLI.
# =============================================================================

# ---------------------------------------------------------------------------
# Sandbox (isolated execution for generated code)
# ---------------------------------------------------------------------------
sandbox:
  # "docker" provides full container isolation with seccomp hardening and is
  # the recommended production setting.  Falls back to subprocess execution
  # automatically when Docker is unavailable (e.g. in lightweight CI runners).
  # WARNING: "subprocess" mode runs generated code directly in the host process
  # with no container boundary — only use it in fully trusted environments or
  # when Docker is genuinely unavailable.
  backend: "docker"    # "docker" (recommended) | "subprocess" (unsafe fallback)
  image: "python:3.11-slim"
  mem_limit: "512m"
  cpu_count: 1
  network_disabled: true
  timeout_seconds: 60

# ---------------------------------------------------------------------------
# Agent (ReAct loop)
# ---------------------------------------------------------------------------
agent:
  max_steps: 10
  system_prompt: "You are an expert ML researcher and software engineer with access to ETFT tools."

# ---------------------------------------------------------------------------
# Coding-Agent Proxy
# All LLM traffic is routed through a coding-agent proxy container.
# The container can run locally (Docker) or be a remote cloud endpoint.
# ---------------------------------------------------------------------------
agent_proxy:
  url: "http://localhost:8080"      # Override with AGENT_PROXY_URL env var
  token: ""                          # Override with AGENT_PROXY_TOKEN env var
  timeout_seconds: 120
  max_retries: 3
  retry_wait_seconds: 5

  # Local Docker container settings (used when mode = "local")
  container:
    mode: "local"                    # "local" | "cloud"
    image: "autoscientist-etft-agent:latest"
    name: "etft-agent-proxy"
    port: 8080
    # Resource limits for the lightweight container
    mem_limit: "2g"
    cpu_count: 2
    # The proxy server's own LLM backend (set in container env)
    proxy_llm_backend: "openai"
    proxy_llm_model: "gpt-4o"

# ---------------------------------------------------------------------------
# Data Paths
# ---------------------------------------------------------------------------
data:
  root: "./data"
  d_gen: "./data/d_gen"
  d_rationale: "./data/d_rationale"
  d_perf: "./data/d_perf"
  trajectories: "./data/trajectories"

# ---------------------------------------------------------------------------
# Corpus / Regression Pipeline
# ---------------------------------------------------------------------------
corpus:
  regression_pipeline:
    max_regression_depth: 10        # Maximum number of de-optimisation steps per trajectory
    validation_timeout_seconds: 60  # Timeout for CI/CD code validation
    max_code_size_bytes: 524288     # 512 KB hard limit per generated file
  performance_estimator:
    test_size: 0.2
    random_state: 42
    n_estimators: 200               # RandomForest trees

# ---------------------------------------------------------------------------
# Calibration (Recursive Stage-Gate)
# Runs after corpus-building and before SOTA+x synthesis.
# The model must replay the evolutionary trajectory with C >= confidence_threshold
# before the stage-gate opens and synthesis is permitted.
# ---------------------------------------------------------------------------
calibration:
  confidence_threshold: 0.65      # Minimum C = (1/n) Σ Sim(pred, true) to open the gate
  min_replay_steps: 2             # Minimum trajectory pairs that must be replayed
  similarity_metric: "composite"  # "composite" | "token_jaccard" | "line_lcs" | "ast_edit" | "ast_node_sequence"
  skip_on_short_trajectory: true  # Auto-pass gate for trajectories shorter than min_replay_steps+1
  output_dir: "./data/calibration" # CalibrationRecord JSON output directory

  # --- B1: Prompt code truncation limit -----------------------------------
  # Maximum characters from before.code included in the reconstruction prompt.
  # Hard-coded 4000 is replaced by this configurable limit.  Set higher for
  # large algorithm files; lower to reduce token costs.
  max_code_chars: 8000

  # --- A4: Per-step minimum similarity floor ------------------------------
  # Even if the mean C ≥ threshold, the gate closes when any individual step
  # similarity falls below this floor.  Set to 0.0 to disable.
  min_step_similarity: 0.35

  # --- A4: Recency weighting ----------------------------------------------
  # When true, later trajectory steps receive linearly higher weight when
  # computing C (step n weighted n / Σ(1..n)).  False = unweighted mean.
  recency_weighting: false

  # --- B2: Agent failure rate gate ----------------------------------------
  # Maximum fraction of attempted steps that may fail before the gate closes
  # with an "agent_failure" diagnostic instead of a low-C diagnostic.
  max_agent_failure_rate: 0.5

  # --- A3: Blind reconstruction mode --------------------------------------
  # When true, the prompt omits exact delta values and the causal explanation,
  # replacing them with ordinal descriptions ("moderate improvement in loss").
  # Useful for quantifying prompt leakage.  Default false for compatibility.
  blind_mode: false

  # --- C1: Composite metric weights ---------------------------------------
  # (w_jaccard, w_lcs, w_ast) — must sum to 1.0.
  # Controls the relative contribution of each sub-metric in "composite" mode.
  similarity_weights: [0.4, 0.3, 0.3]

  # --- A1: Held-out calibration split -------------------------------------
  # Fraction of trajectory steps (from the end) tagged as "calibration" split
  # and used exclusively by Evolutionary Replay (excluded from training).
  # Set to 0.0 (default) to disable held-out splitting (all steps = "train").
  held_out_frac: 0.0

  # --- C3: Non-contiguous step gap limit ----------------------------------
  # Maximum allowed step index gap between adjacent replay pairs.  Pairs with
  # a larger gap are skipped.  null = no limit.
  max_step_gap: null

# ---------------------------------------------------------------------------
# Analysis
# ---------------------------------------------------------------------------
analysis:
  pareto_delta:
    pareto_threshold: 0.80          # 80% cumulative contribution threshold
    min_delta_lines: 5              # Ignore deltas smaller than N lines

# ---------------------------------------------------------------------------
# Agents
# ---------------------------------------------------------------------------
agents:
  literature:
    max_papers: 10                  # Papers retrieved per research query
    chunk_size_tokens: 512
    chunk_overlap_tokens: 64
    arxiv_max_results: 20
    request_delay_seconds: 0.4     # Delay between paper fetch requests (arXiv rate limit)
  empirical:
    experiment_timeout_seconds: 120
    max_script_size_bytes: 65536    # 64 KB hard limit on generated scripts
    allowed_packages:               # Whitelist for auto-installed packages
      - numpy
      - scipy
      - torch
      - sklearn
    blocked_builtins:               # Additional dangerous builtins to block (beyond defaults)
      - exec
      - eval
      - __import__
      - compile

# ---------------------------------------------------------------------------
# Vector Store (persistent RAG memory for literature agents)
# Set backend to "chroma" and install 'autoscientist-etft[rag]' to retain
# knowledge across ARL runs.  Use "memory" for ephemeral, single-run use.
# The persist_dir can be overridden at runtime with VECTOR_STORE_PERSIST_DIR.
# ---------------------------------------------------------------------------
vector_store:
  backend: "memory"             # "chroma" (persistent, requires [rag] extra) | "memory" (transient, default)
  persist_dir: "./data/vector_store"   # ChromaDB data directory; override with VECTOR_STORE_PERSIST_DIR
  collection: "literature"
  n_results: 20                 # Number of chunks returned per semantic query

# ---------------------------------------------------------------------------
# Synthesis
# ---------------------------------------------------------------------------
synthesis:
  triage:
    risk_threshold: 0.7             # Reject candidates with P(fail) > threshold
  sota_plus_one:
    max_candidates: 3               # Generate N candidates and pick the best

# ---------------------------------------------------------------------------
# Cluster Submission (optional — required for SlurmAdapter / KubernetesAdapter)
# ---------------------------------------------------------------------------
cluster:
  # Default adapter for physical GPU evaluation.
  # Options: "local" | "slurm" | "kubernetes"
  adapter: "local"

  slurm:
    partition: "gpu"
    n_gpus: 1
    mem_gb: 32
    time_limit: "01:00:00"       # HH:MM:SS
    python_path: "python3"
    poll_interval_seconds: 30
    timeout_seconds: 3600

  k8s:
    namespace: "default"
    image: "python:3.11-slim"
    gpu_count: 1
    memory_limit: "8Gi"
    cpu_limit: "4"
    poll_interval_seconds: 10
    timeout_seconds: 1800
    service_account: ""          # optional Kubernetes service account

# ---------------------------------------------------------------------------
# Fine-tuning
# ---------------------------------------------------------------------------
training:
  # HuggingFace PEFT/LoRA path
  base_model: "meta-llama/Meta-Llama-3-8B"
  output_dir: "./checkpoints"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  fp16: true
  val_split: 0.1          # Fraction of corpus held out for validation (0 to disable)
  dataset_path: "./data"
  # OpenAI fine-tune path (alternative)
  openai_finetune_model: "gpt-3.5-turbo"
